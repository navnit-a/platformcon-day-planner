name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: data pull requests touch only their file
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent-')
        run: scripts/check-data-pr.sh "$GITHUB_HEAD_REF" "origin/$GITHUB_BASE_REF"
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test -- --run --coverage
      - run: npm run build
